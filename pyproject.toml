[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "history-tts"
version = "0.2.0"
description = "Historical video production workflow with topic selection, review gates and optional local TTS"
requires-python = ">=3.12,<3.13"
dependencies = ["qwen-tts==0.1.1", "psutil>=7,<8"]

[project.optional-dependencies]
workflow = ["python-docx>=1.1,<2", "Pillow>=10,<13"]

[project.scripts]
history-tts = "history_tts.cli:main"
history-workflow = "history_workflow.cli:main"

[tool.setuptools.packages.find]
include = ["history_tts*", "history_workflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
